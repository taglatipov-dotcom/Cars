# /etc/nginx/sites-available/ilsatao
# Установка:  sudo cp /root/Cars/deploy/nginx-ilsatao.conf /etc/nginx/sites-available/ilsatao
#             sudo nginx -t && sudo systemctl reload nginx

server {
    server_name ilsatao.ru www.ilsatao.ru ilsatao.com www.ilsatao.com;
    root /var/www/ilsatao-frontend;
    index index.html;

    # Один адрес сайта для поисковиков: www и .com → https://ilsatao.ru
    if ($host != "ilsatao.ru") {
        return 301 https://ilsatao.ru$request_uri;
    }

    # ---- Структура сайта (с ноября 2026) ----
    #   /           витрина ILSATAO            /box   новогодние боксы
    #   /cars/...   сайт авто                  /bags  сумки
    #   /admin/...  ОДНА общая админка (SPA)   /api/, /uploads/ — бэкенд, как раньше
    # Всё это — одно React-приложение из /var/www/ilsatao-frontend (base '/').

    # Старые адреса сайта авто (без /cars) → 301 на новые, чтобы не потерять поиск и ссылки.
    # $request_uri сохраняет ?query (например, параметры калькулятора).
    location ~ ^/(catalog|calculator|about|privacy|reviews|blog|car)(/.*)?$ {
        return 301 /cars$request_uri;
    }
    location = /cars { return 301 /cars/; }

    # ---- SEO: готовые страницы от бэкенда (src/seo.py, src/seo_router.py) ----
    # Сайт авто: /cars/, /cars/catalog, /cars/calculator, /cars/blog, /cars/reviews, /cars/about,
    # /cars/privacy, /cars/car/<адрес>, /cars/blog/<адрес>  →  /seo/render/<путь без /cars>
    location ~ ^/cars(/((catalog|calculator|blog|reviews|about|privacy)/?|(car|blog)/[^/.]+/?)?)$ {
        proxy_pass http://127.0.0.1:8000/seo/render$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Бэкенд недоступен или нет index.html → обычная SPA, сайт продолжает работать
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa;
    }

    # Витрина и разделы: / → /seo/site/_, /box → /seo/site/_box, /bags → /seo/site/_bags
    location ~ ^/(box|bags)?/?$ {
        proxy_pass http://127.0.0.1:8000/seo/site/_$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa;
    }

    location @spa {
        try_files /index.html =404;
    }

    # sitemap собирается из базы автоматически
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/seo/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Остальные страницы SPA (админка, /cars/... без SEO-версии)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API. ^~ — чтобы regex для картинок ниже никогда не перехватывал запросы к API
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Загруженные фото и миниатюры (/uploads/thumbs/...) — из бэкенда
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Статика фронтенда (у файлов сборки в имени хеш — можно кешировать на год)
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ilsatao.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ilsatao.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# http → https. Раньше ilsatao.com по http отдавал 404 — теперь тоже редирект.
server {
    listen 80;
    server_name ilsatao.ru www.ilsatao.ru ilsatao.com www.ilsatao.com;
    return 301 https://ilsatao.ru$request_uri;
}
