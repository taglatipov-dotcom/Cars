# /etc/nginx/sites-available/ilsatao
# Установка:  sudo cp /root/Cars/deploy/nginx-ilsatao.conf /etc/nginx/sites-available/ilsatao
#             sudo nginx -t && sudo systemctl reload nginx

server {
    server_name ilsatao.ru www.ilsatao.ru ilsatao.com www.ilsatao.com;
    root /var/www/ilsatao-frontend;
    index index.html;

    # Один адрес сайта для поисковиков: www и .com → https://ilsatao.ru
    if ($host != "ilsatao.ru") {
        return 301 https://ilsatao.ru$request_uri;
    }

    # ---- SEO: готовые страницы от бэкенда (src/seo.py) ----
    # /, /catalog, /blog, /reviews, /car/<адрес>, /blog/<адрес>
    location ~ ^/((catalog|blog|reviews)/?|(car|blog)/[^/.]+/?)?$ {
        proxy_pass http://127.0.0.1:8000/seo/render$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Бэкенд недоступен или нет index.html → обычная SPA, сайт продолжает работать
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa;
    }

    location @spa {
        try_files /index.html =404;
    }

    # sitemap собирается из базы автоматически
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/seo/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Остальные страницы SPA (about, privacy, админка)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API. ^~ — чтобы regex для картинок ниже никогда не перехватывал запросы к API
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Загруженные фото и миниатюры (/uploads/thumbs/...) — из бэкенда
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Статика фронтенда (у файлов сборки в имени хеш — можно кешировать на год)
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ilsatao.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ilsatao.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# http → https. Раньше ilsatao.com по http отдавал 404 — теперь тоже редирект.
server {
    listen 80;
    server_name ilsatao.ru www.ilsatao.ru ilsatao.com www.ilsatao.com;
    return 301 https://ilsatao.ru$request_uri;
}
